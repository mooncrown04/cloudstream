name: Pre-release (Fork-Friendly)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
      # Doküman/not değişiklikleri yeni APK üretmesin
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode keystore
      # Keystore kullanıcı ev dizinine yazılıyor; /work gibi kök dizinlere
      # yazma izni yok. Yol SIGNING_STORE_FILE ile Gradle'a açıkça veriliyor.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
      run: |
        set -euo pipefail
        KEYSTORE_PATH="$HOME/keystore/release.jks"
        mkdir -p "$HOME/keystore"
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
        echo "Keystore yazıldı: $KEYSTORE_PATH ($(stat -c%s "$KEYSTORE_PATH") bayt)"
        echo "SIGNING_STORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"
        # İmzalama öncesi erken doğrulama
        keytool -list -keystore "$KEYSTORE_PATH" -storepass "$SIGNING_STORE_PASSWORD" | head -5

    - name: Update library ABI reference
      # Upstream kodu değiştirip library.api referansını güncellememiş olabilir
      # (:library:checkLegacyAbi hata verir). Referansı otomatik yenile.
      run: ./gradlew :library:updateKotlinAbi || true

    - name: Run Gradle Build
      # İmzalı release APK + jar dosyaları
      run: ./gradlew assemblePrereleaseRelease --stacktrace
      env:
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    - name: Create pre-release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "pre-release"
        prerelease: true
        title: "Kendi Derlemem - Pre-release Build"
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/libs/*.jar
          app/build/*.jar
