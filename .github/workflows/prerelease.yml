name: Pre-release (Fork-Friendly)

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
      # Doküman/not değişiklikleri yeni APK üretmesin
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: "pre-release"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Decode keystore
      # app/build.gradle.kts keystore'u ~/work/_temp/keystore/ altında arıyor.
      # DİKKAT: echo "${{ ... }}" satır sonlarını bozabiliyor ("Tag number over 30"
      # hatası). Bu yüzden secret env değişkeni olarak geçirilip printf ile yazılıyor.
      env:
        KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      run: |
        # Not: burada $HOME KULLANILMIYOR; $HOME /home/runner olur ve Gradle
        # /work/_temp/keystore/release.jks arıyor (JAVA user.home farklı).
        mkdir -p /work/_temp/keystore
        printf '%s' "$KEYSTORE_BASE64" | base64 -d > /work/_temp/keystore/release.jks
        echo "Keystore boyutu: $(stat -c%s /work/_temp/keystore/release.jks) bayt"
        # Dosyanın gerçekten okunabildiğini doğrula (imzalama öncesi erken hata)
        keytool -list -keystore /work/_temp/keystore/release.jks -storepass "${{ secrets.SIGNING_STORE_PASSWORD }}" | head -5

    - name: Run Gradle Build
      # İmzalı release APK + jar dosyaları
      run: ./gradlew assemblePrereleaseRelease androidSourcesJar makeJar || ./gradlew assemblePrereleaseRelease
      env:
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}
        SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
        SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}

    - name: Create pre-release
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "pre-release"
        prerelease: true
        title: "Kendi Derlemem - Pre-release Build"
        files: |
          app/build/outputs/apk/prerelease/release/*.apk
          app/build/libs/*.jar
          app/build/*.jar
