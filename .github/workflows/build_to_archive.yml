name: Archive build

on:
  push:
    branches: [ master ]
    paths-ignore:
      - '*.md'
      - '*.json'
      - '**/wcokey.txt'
  workflow_dispatch:

# Node.js 24 uyarısını susturmak için opsiyonel env
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: "Archive-build"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # Türkçe (values-tr) dosyasında eksik kalan metin anahtarlarını tespit eden hafif kontrol adımı
    - name: Check Missing Turkish Strings
      run: |
        python3 -c "
        import xml.etree.ElementTree as ET
        import os

        default_xml = 'app/src/main/res/values/strings.xml'
        tr_xml = 'app/src/main/res/values-tr/strings.xml'

        if not os.path.exists(default_xml) or not os.path.exists(tr_xml):
            print('XML dosyalarindan biri bulunamadi, kontrol atlaniyor.')
            exit(0)

        def parse_keys(file_path):
            tree = ET.parse(file_path)
            root = tree.getroot()
            keys = set()
            for child in root:
                if 'name' in child.attrib:
                    keys.add(child.attrib['name'])
            return keys

        def_keys = parse_keys(default_xml)
        tr_keys = parse_keys(tr_xml)

        missing = def_keys - tr_keys

        print('==================================================')
        if missing:
            print(f'Turkce (values-tr) dosyasinda eksik olan {len(missing)} adet string anahtari bulundu:')
            for key in sorted(missing):
                print(f' - {key}')
        else:
            print('Tebrikler! Turkce strings.xml dosyasinda eksik anahtar bulunamadi.')
        print('==================================================')
        "
      continue-on-error: true

    - name: Run Gradle Build
      run: ./gradlew clean assembleDebug --stacktrace --info
      env:
        SIMKL_CLIENT_ID: ${{ secrets.SIMKL_CLIENT_ID }}
        SIMKL_CLIENT_SECRET: ${{ secrets.SIMKL_CLIENT_SECRET }}
        MDL_API_KEY: ${{ secrets.MDL_API_KEY }}

    # Üretilen APK'nın yerini kesin olarak bulmak için bu adımı ekledik
    - name: Find APK Path
      run: find app/build/outputs/apk/ -name "*.apk"

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: CloudStream-Debug-APK
        # 'debug/*.apk' yerine '**/*.apk' kullanarak tüm alt klasörleri tarıyoruz
        path: "app/build/outputs/apk/**/*.apk"
